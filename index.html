<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>멍냥닥터 - 강아지 슬개골 탈구 자가진단</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center shadow-sm">
          <i data-lucide="stethoscope" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 leading-tight">멍냥닥터 슬개골 체크</h1>
          <p class="text-xs text-slate-500">우리 아이 다리 건강 &amp; 슬개골 탈구 자가진단</p>
        </div>
      </div>
      <button onclick="openModal('settingsModal')" class="p-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition" title="구글 시트 연동 설정">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-6 space-y-6">

    <!-- Notice Banner -->
    <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 flex items-start gap-3">
      <i data-lucide="info" class="w-5 h-5 text-emerald-600 shrink-0 mt-0.5"></i>
      <div class="text-sm text-emerald-900 leading-relaxed">
        본 자가진단은 일상 속 행동 관찰을 바탕으로 슬개골 탈구 위험도와 예상 단계를 가늠해보는 참고용 도구입니다. 정확한 기수 판정 및 치료 계획은 반드시 수의사의 촉진 및 방사선(X-ray) 검사를 통해 확인하세요.
      </div>
    </div>

    <!-- Step 1: Dog Basic Info -->
    <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
      <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
        <span class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 font-bold text-xs flex items-center justify-center">1</span>
        <h2 class="font-bold text-base text-slate-900">반려견 기본 정보 입력</h2>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">반려견 이름</label>
          <input type="text" id="dogName" placeholder="예: 몽이" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">견종</label>
          <input type="text" id="dogBreed" placeholder="예: 말티즈, 푸들, 포메라니안" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">나이 (개월 수 또는 년/개월)</label>
          <input type="text" id="dogAge" placeholder="예: 3살 (36개월)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">몸무게 (kg)</label>
          <input type="number" step="0.1" id="dogWeight" placeholder="예: 4.2" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
      </div>
    </section>

    <!-- Step 2: Symptom Checklist -->
    <section class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-6">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 font-bold text-xs flex items-center justify-center">2</span>
          <h2 class="font-bold text-base text-slate-900">관찰 증상 체크리스트 (해당 항목 모두 선택)</h2>
        </div>
        <span id="checkedCounter" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">0개 선택됨</span>
      </div>

      <!-- Stage 1 Items -->
      <div class="space-y-2.5">
        <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-700 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span> 초기 관찰 항목 (1기 의심 신호)
        </h3>
        <div class="space-y-2">
          <label class="flex items-start gap-3 p-3.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
            <input type="checkbox" name="item" value="0" data-category="1" class="mt-0.5 w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500" />
            <span class="text-sm text-slate-700">평소에는 잘 걷다가 가끔 뒷다리 한쪽을 잠깐 들고 깽깽이걸음을 한다.</span>
          </label>
          <label class="flex items-start gap-3 p-3.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
            <input type="checkbox" name="item" value="1" data-category="1" class="mt-0.5 w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500" />
            <span class="text-sm text-slate-700">미끄러운 바닥(장판, 마루)에서 뒷다리가 자주 미끄러지거나 중심을 잃는다.</span>
          </label>
          <label class="flex items-start gap-3 p-3.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
            <input type="checkbox" name="item" value="2" data-category="1" class="mt-0.5 w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500" />
            <span class="text-sm text-slate-700">무릎 관절 부위를 만지거나 굽혔다 펼 때 작게 '뚝' 또는 '딸깍' 소리가 난 적이 있다.</span>
          </label>
        </div>
      </div>

      <!-- Stage 2 Items -->
      <div class="space-y-2.5">
        <h3 class="text-xs font-bold uppercase tracking-wider text-amber-600 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span> 중기 진행 항목 (2기 의심 신호)
        </h3>
        <div class="space-y-2">
          <label class="flex items-start gap-3 p-3.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
            <input type="checkbox" name="item" value="3" data-category="2" class="mt-0.5 w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500" />
            <span class="text-sm text-slate-700">산책 중 갑자기 주저앉거나 뒷다리를 뒤로 쭉 뻗으며 스트레칭하듯 펴는 행동을 자주 한다.</span>
          </label>
          <label class="flex items-start gap-3 p-3.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
            <input type="checkbox" name="item" value="4" data-category="2" class="mt-0.5 w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500" />
            <span class="text-sm text-slate-700">소파나 침대 위로 뛰어오르기를 주저하거나 점프 높이가 예전보다 낮아졌다.</span>
          </label>
          <label class="flex items-start gap-3 p-3.5 rounded-xl border border-slate-200 hover
